[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joule-ble"
version = "0.1.0"
description = "Control a ChefSteps Joule sous vide over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    # base_pb2.py was generated by protoc 7.35.1; the runtime must be at least that.
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
dev = ["grpcio-tools"]

[project.scripts]
joule = "joule.cli:main"

[tool.setuptools]
packages = ["joule"]
